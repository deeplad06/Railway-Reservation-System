<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Railway Reservation System</h1>
        <p>Search trains and explore available routes</p>
    </header>

    <main>
        <section class="search-box">
            <h2>Search Trains</h2>
            <label for="source">Source Station</label>
            <input type="text" id="source" placeholder="Enter source station">

            <label for="destination">Destination Station</label>
            <input type="text" id="destination" placeholder="Enter destination station">

            <button id="searchBtn">Search Trains</button>
            <p id="message" role="status"></p>
        </section>

        <section class="results">
            <h2>Available Trains</h2>
            <div id="trainResults"></div>
        </section>
    </main>

    <footer>
        <p>Educational demonstration project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
